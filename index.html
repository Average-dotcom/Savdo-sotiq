<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12424f">
<title>Savdo va ombor tizimi — 4-bosqich</title>
<style>
:root{
  --paper:#f2f4f3; --card:#ffffff; --ink:#18232b; --mute:#5d6b74; --line:#d9dfe2;
  --teal:#12424f; --teal2:#1d6577; --amber:#e3a02f; --amberbg:#fdf1d8; --red:#b3374a; --redbg:#fae3e7; --green:#2f7d52; --greenbg:#e1f2e8;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#11181d; --card:#1a242b; --ink:#e8eef1; --mute:#93a2ab; --line:#2c3a43; --teal:#6fc1d4; --teal2:#4aa3b9; --amberbg:#3b2f14; --redbg:#40202a; --greenbg:#1b3327; --green:#6fcf97; --red:#ef8a9a}
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.top{background:var(--teal);color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
@media (prefers-color-scheme:dark){.top{background:#0c2d37;color:#e8eef1}}
.top b{font-size:16px}
.top .sp{flex:1}
.top select{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:inherit;border-radius:8px;padding:6px 8px}
.top select option{color:#18232b}
.who{font-size:13px;opacity:.9}
.grps{display:flex;gap:6px;padding:10px 14px;background:var(--paper);overflow-x:auto;border-bottom:1px solid var(--line)}
.grps button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;cursor:pointer;color:var(--mute);font-weight:700;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:5px}
.grps button.on{color:#fff;background:var(--teal);border-color:var(--teal)}
.tabs{display:flex;gap:4px;padding:10px 14px 0;border-bottom:1px solid var(--line);background:var(--card);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;color:var(--mute);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tabs button.on{color:var(--teal);border-color:var(--amber)}
.beta{display:inline-block;background:var(--amber);color:#fff;border-radius:5px;padding:1px 6px;font-size:9.5px;font-weight:800;letter-spacing:.03em;vertical-align:1px}
main{max-width:1000px;margin:0 auto;padding:14px}
.btn{border:0;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--teal);color:#fff}
@media (prefers-color-scheme:dark){.btn{color:#0c2d37}}
.btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:10px 12px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar>*{flex:1 1 150px}
.bar .btn{flex:0 0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat small{color:var(--mute);display:block}
.stat strong{font-size:19px}
.alert{border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.alert.warn{background:var(--amberbg);border:1px solid var(--amber)}
.alert.bad{background:var(--redbg);border:1px solid var(--red)}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.row .nm{font-weight:600}
.row .sub{color:var(--mute);font-size:13px;word-break:break-all}
.row .num{text-align:right}
.row .act{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.b-ok{background:var(--greenbg);color:var(--green)}
.b-low{background:var(--amberbg);color:#9a6a0a}
@media (prefers-color-scheme:dark){.b-low{color:var(--amber)}}
.b-zero{background:var(--redbg);color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.muted{color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
dialog{border:1px solid var(--line);border-radius:14px;padding:16px;width:min(520px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:20;max-width:90vw}
.login{max-width:380px;margin:8vh auto;padding:0 14px}
.login h1{font-size:24px;margin:0 0 4px}
.hint{font-size:13px;color:var(--mute);margin-top:14px;line-height:1.7}
.err{color:var(--red);font-size:14px;margin-top:8px;min-height:20px}
.lg{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:baseline;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:14px}
.lg .t{color:var(--mute);font-size:12px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--paper);border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pos{display:grid;grid-template-columns:1fr 1.1fr;gap:14px;align-items:start}
@media (max-width:760px){.pos{grid-template-columns:1fr}}
.cl{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.cl .nm{font-weight:600}.cl .sub{color:var(--mute);font-size:13px}
.cl input[type=number]{width:72px;padding:8px}
.qty{display:flex;gap:4px;align-items:center}
.qty input{width:56px;text-align:center;padding:6px}
.num{text-align:right}
.sumrow{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.sumrow.big{font-weight:700;font-size:17px;border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.rc{font-family:"Courier New",monospace;font-size:13px;line-height:1.5;color:var(--ink)}
.rc hr{border:0;border-top:1px dashed var(--mute);margin:8px 0}
.rc .c{text-align:center}
.rr{display:flex;justify-content:space-between;gap:10px}
.rr.big{font-weight:700;font-size:15px}
@media print{
  body *{visibility:hidden}
  #receipt,#receipt *,#printarea,#printarea *{visibility:visible}
  #receipt,#printarea{position:absolute;left:0;top:0;width:100%;color:#000}
}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--ink);font-size:14px}
.chk input{width:auto}
.net{font-size:12px;padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.16)}
.net.offl{background:var(--amber);color:#18232b;font-weight:700}
.stats .stat strong{font-size:17px}

/* ---- Kirish va umumiy dizayn ---- */
.lw{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:100vh}
.lb{background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.18),transparent 45%),radial-gradient(circle at 85% 88%,rgba(227,160,47,.38),transparent 42%),linear-gradient(150deg,var(--teal),var(--teal2));color:#fff;padding:7vh 6vw;display:flex;flex-direction:column;justify-content:center;gap:14px}
@media (prefers-color-scheme:dark){.lb{background:radial-gradient(circle at 85% 88%,rgba(227,160,47,.25),transparent 42%),linear-gradient(150deg,#0c2d37,#12424f)}}
.logo{width:68px;height:68px;border-radius:20px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.32);display:grid;place-items:center;font-size:32px;font-weight:800}
.lb h1{font-size:clamp(28px,4vw,42px);margin:6px 0 0;line-height:1.1}
.lb p{margin:0;opacity:.9;max-width:36ch}
.feat{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.feat li{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);border-radius:99px;padding:5px 12px;font-size:13px}
.lf{display:flex;align-items:center;justify-content:center;padding:28px 18px}
.lf form{width:min(390px,100%);animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lf h2{margin:0 0 2px;font-size:26px}
.pw{position:relative}.pw input{padding-right:70px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--teal);font-weight:700;cursor:pointer;padding:6px 8px}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw1{display:block;margin:0;position:relative}
.sw1 input{position:absolute;opacity:0;width:1px;height:1px}
.sw1 span{display:block;width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw1 input:checked+span{border-color:var(--ink)}.sw1 input:focus-visible+span{outline:3px solid var(--amber);outline-offset:2px}
@media (max-width:800px){.lw{grid-template-columns:1fr}.lb{padding:28px 20px}.lf{align-items:flex-start}}
.top{background:linear-gradient(90deg,var(--teal),var(--teal2))}
@media (prefers-color-scheme:dark){.top{background:#0c2d37}}
.card,.stat,.row,.lg{box-shadow:0 1px 2px rgba(16,40,50,.06),0 8px 18px -12px rgba(16,40,50,.22)}
.btn{transition:transform .12s,filter .12s}.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}
input:focus,select:focus{border-color:var(--teal);outline:2px solid color-mix(in srgb,var(--teal) 25%,transparent)}
.tabs button{border-radius:8px 8px 0 0;transition:background .15s}.tabs button:hover{background:var(--paper)}
h3{margin:18px 0 8px;font-size:16px}

/* ---- Animatsiyalar va rasmlar ---- */
.lb{position:relative;overflow:hidden;background-size:cover}
.lb>*:not(.blob){position:relative;z-index:1}
.blob{position:absolute;border-radius:50%;filter:blur(40px);pointer-events:none;animation:drift 14s ease-in-out infinite alternate}
.blob.b1{width:340px;height:340px;background:rgba(255,255,255,.28);top:-90px;left:-70px}
.blob.b2{width:300px;height:300px;background:rgba(227,160,47,.5);bottom:-90px;right:-40px;animation-duration:18s;animation-delay:-6s}
@keyframes drift{to{transform:translate(80px,60px) scale(1.25)}}
.logo{animation:float 5s ease-in-out infinite;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain}
@keyframes float{50%{transform:translateY(-8px) rotate(-3deg)}}
.shine{background:linear-gradient(90deg,#fff 25%,#ffe3a6 45%,#fff 65%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4.5s linear infinite}
@keyframes shine{to{background-position:-220% 0}}
.feat li{animation:rise .6s ease both}.feat li:nth-child(2){animation-delay:.12s}.feat li:nth-child(3){animation-delay:.24s}.feat li:nth-child(4){animation-delay:.36s}
.typing::after{content:'▍';margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
main{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.row,.stat{transition:transform .15s,box-shadow .15s}
.row:hover,.stat:hover{transform:translateY(-2px);box-shadow:0 10px 22px -12px rgba(16,40,50,.35)}
dialog[open]{animation:pop .22s ease both}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}}
.toast{animation:toastin .3s ease both}
@keyframes toastin{from{opacity:0;transform:translate(-50%,14px)}}
.av{border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;background:rgba(255,255,255,.24);color:#fff;font-weight:700;vertical-align:middle;flex:none}
.av.sq{border-radius:8px;object-fit:contain}
.top b{display:inline-flex;align-items:center;gap:8px}
.upl{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pv{width:76px;height:76px;border-radius:16px;border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden;background:var(--paper);font-size:30px;font-weight:800;color:var(--teal)}
.pv img{width:100%;height:100%;object-fit:cover}.pv.wide{width:150px}
label.btn{margin:0;display:inline-block;color:#fff}.btn:focus-within{outline:3px solid var(--amber);outline-offset:2px}
.vh{position:absolute;opacity:0;width:1px;height:1px}

/* ---- Qiziqarli dizayn ---- */
body{background-image:radial-gradient(circle at 100% 0,color-mix(in srgb,var(--teal) 12%,transparent),transparent 42%),radial-gradient(circle at 0 100%,color-mix(in srgb,var(--amber) 14%,transparent),transparent 42%);background-attachment:fixed}
.btn{background:linear-gradient(135deg,var(--teal),var(--teal2));box-shadow:0 8px 16px -10px var(--teal)}
.btn.ghost{background:transparent;box-shadow:none}
.tabs{gap:2px;box-shadow:0 2px 10px -8px rgba(0,0,0,.4)}
.tabs button .ic{margin-right:6px;display:inline-block;transition:transform .2s}
.tabs button:hover .ic,.tabs button.on .ic{transform:scale(1.25) rotate(-6deg)}
.tabs button.on{background:color-mix(in srgb,var(--teal) 10%,transparent)}
.stat{border-top:3px solid var(--teal2);position:relative;overflow:hidden}
.stat:nth-child(even){border-top-color:var(--amber)}
.stat::after{content:'';position:absolute;right:-18px;top:-18px;width:60px;height:60px;border-radius:50%;background:color-mix(in srgb,var(--teal) 9%,transparent)}
.row{border-left:4px solid transparent}.row:hover{border-left-color:var(--amber)}
.card h2{display:flex;align-items:center;gap:8px}
.sw1.cpk{width:34px;height:34px}
.sw1.cpk input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.sw1.cpk span{background:conic-gradient(red,yellow,lime,aqua,blue,magenta,red);display:grid;place-items:center;font-size:15px}
.sw1.cpk input:focus-visible+span{outline:3px solid var(--amber);outline-offset:2px}
.top .av{box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.logo{box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:no-preference){.stat{animation:rise .5s ease both}.stat:nth-child(2){animation-delay:.08s}.stat:nth-child(3){animation-delay:.16s}.stat:nth-child(4){animation-delay:.24s}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>

<script>
/* ---------- Yordamchi funksiyalar ---------- */
const fmt = n => Math.round(Number(n)).toLocaleString('ru-RU').replace(/\u00a0/g,' ');
const money = n => fmt(n) + " so‘m";
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const parseCodes = s => [...new Set(String(s).split(/[\s,;]+/).filter(Boolean))];

/* ---------- Ma’lumotlar (demo: xotirada) ---------- */
const branches = [{id:'b1',name:'Chilonzor filiali'},{id:'b2',name:'Yunusobod filiali'}];
const roles = {
  super:    {label:'Boshlovchi (bosh administrator)', owner:true, tabs:['kassa','sotuvlar','smena','ombor','kirim','inventar','transfer','xarajat','hisobot','ovoz','tarix','zaxira','filiallar','xodimlar'], edit:true,  cost:true,  all:true,  sell:true,  refund:true,  admin:true, stockops:true, expense:true, report:true, backup:true},
  admin:    {label:'Administrator (barcha filial)', tabs:['kassa','sotuvlar','smena','ombor','kirim','inventar','transfer','xarajat','hisobot','ovoz','tarix','zaxira','xodimlar'], edit:true, cost:true, all:true, sell:true, refund:true, admin:true, stockops:true, expense:true, report:true, staff:true},
  filial:   {label:'Filial administratori',   tabs:['kassa','sotuvlar','smena','ombor','kirim','inventar','transfer','xarajat','hisobot','ovoz','tarix'],           edit:true,  cost:true,  all:false, sell:true,  refund:true,  admin:true, stockops:true, expense:true, report:true},
  omborchi: {label:'Omborchi',                tabs:['ombor','kirim','inventar','transfer','ovoz','tarix'],                                                          edit:true,  cost:true,  all:false, stockops:true},
  kassir:   {label:'Kassir',                  tabs:['kassa','sotuvlar','smena','ombor','ovoz'],                                                                     edit:false, cost:false, all:false, sell:true,  own:true},
  viewer:   {label:'Hisobot ko‘ruvchi',       tabs:['sotuvlar','smena','ombor','xarajat','hisobot','ovoz','tarix'],                                                 edit:false, cost:true,  all:true,  report:true}
};
Object.values(roles).forEach(r => r.tabs.push('profil'));
const users = [];   /* kirgandan keyin Google Sheets (Users varag‘i) dan to‘ladi */
let nextId = 1;
const mk = (name,codes,cat,cost,price,min,s1,s2) => ({id:nextId++,name,barcodes:codes,cat,cost,price,min,stock:{b1:s1,b2:s2}});
const products = [
  mk('Snickers Mini',['73836368'],'Shirinliklar',2800,4000,10,5,12),
  mk('Coca-Cola 0.5 l',['5449000000996','5449000214911'],'Ichimliklar',4500,6500,20,48,30),
  mk('Non (patir)',['2000000000011'],'Non mahsulotlari',2500,4000,15,0,9),
  mk('Sut 1 l «Lactel»',['4780000000123'],'Sut mahsulotlari',9000,12500,12,8,20),
  mk('Shakar 1 kg',['4780000000456'],'Oziq-ovqat',11000,14000,10,35,40),
  mk('Choy «Ahmad» 100 g',['6291041500213'],'Oziq-ovqat',17000,22000,8,6,3),
  mk('Suv 1.5 l',['4780000000789'],'Ichimliklar',2200,3500,25,60,55)
];
const log = [];
let logId = 1;
function addLog(type, product, branch, qty, sum, note){
  log.push(Object.freeze({id:logId++, t:new Date(), type, pid:product?.id, pname:product?.name || '—', branch, user:S.user.name, qty, sum, note:note||''}));
}

/* ---------- Holat ---------- */
const S = {user:null, branch:'b1', tab:'ombor', grp:'tovar', q:'', cat:'', low:false, kq:'', kpid:null, lt:'', lb:'', cart:[], dtype:'pct', dval:0, card:0, given:0, paying:false, sq:'', sd:'today', trd:[], trTo:'', trdBranch:'', xm:'', online:true, autoBk:true, bkMin:5, rp:'today', vs:false, vlang:'uz-UZ'};
const tabGroups = {kassa:'savdo', sotuvlar:'savdo', smena:'savdo', ovoz:'savdo', ombor:'tovar', kirim:'tovar', inventar:'tovar', transfer:'tovar', xarajat:'huj', hisobot:'huj', tarix:'huj', zaxira:'huj', filiallar:'bosh', xodimlar:'bosh', profil:'profil'};
const groupMeta = {savdo:{label:'Savdo va kassa', icon:'🛒'}, tovar:{label:'Tovarlar', icon:'📦'}, huj:{label:'Hujjatlar', icon:'📑'}, bosh:{label:'Boshqaruv', icon:'🏬'}, profil:{label:'Profil', icon:'⚙️'}};
const groupOrder = ['savdo', 'tovar', 'huj', 'bosh', 'profil'];
const grpOf = t => tabGroups[t] || 'savdo';
const R = () => roles[S.user.role];
const stockOf = p => p.stock[S.branch] || 0;
const status = p => { const s = stockOf(p); return s <= 0 ? 'zero' : s <= p.min ? 'low' : 'ok'; };
const bname = id => branches.find(b => b.id === id)?.name || id;

function toast(msg){
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; el.setAttribute('role','status');
  document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
}

/* ---------- Kirish ---------- */
function showLogin(){
  const h = new Date().getHours(), hi = h < 5 ? 'Xayrli tun' : h < 12 ? 'Xayrli tong' : h < 18 ? 'Xayrli kun' : 'Xayrli kech';
  $('app').innerHTML = `<div class="lw" style="${lwStyle()}">${brandPane(BRAND.shop.trim().charAt(0).toUpperCase() || 'S', BRAND.shop, BRAND.tagline || 'Savdo va ombor boshqaruv tizimi')}
  <section class="lf"><form id="lf" autocomplete="off">
      <h2>${hi}!</h2><div class="muted">${esc(BRAND.shop)} tizimiga kirish uchun login va parolni kiriting</div>
      <label for="lg">Login</label><input id="lg" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <label for="ps">Parol</label><div class="pw"><input id="ps" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" required><button type="button" id="pt" aria-label="Parolni ko‘rsatish">Ko‘rsat</button></div>
      <div class="err" id="le" role="alert"></div>
      <button class="btn" style="width:100%">Kirish</button>
  </form></section></div>`;
  typeIn($('tg'));
  $('pt').onclick = () => { const i = $('ps'), sh = i.type === 'password'; i.type = sh ? 'text' : 'password'; $('pt').textContent = sh ? 'Yashir' : 'Ko‘rsat'; };
  $('lf').insertAdjacentHTML('beforeend', '<button type="button" class="btn ghost sm" id="chg" style="margin-top:12px">Google Sheets ulanishini o‘zgartirish</button>');
  $('chg').onclick = () => { API.url = ''; API.tok = ''; lsSet(SHEETS_KEY, ''); lsSet(TOK_KEY, ''); showConnect(); };

/* ---------- Artikul va barcode generatsiyasi ---------- */
const ean13 = d12 => { let t = 0; [...d12].forEach((c, i) => t += +c * (i % 2 ? 3 : 1)); return d12 + ((10 - t % 10) % 10); };
function genBarcode(){
  const used = new Set(products.flatMap(p => p.barcodes));
  for(let n = products.length + 1; ; n++){ const c = ean13('2' + String(n).padStart(11, '0')); if(!used.has(c)) return c; }
}
function genSku(){
  const m = Math.max(0, ...products.map(p => +((/^ART-(\d+)$/.exec(p.sku || '') || [0, 0])[1])));
  return 'ART-' + String(m + 1).padStart(4, '0');
}
function fixSku(){ products.forEach(p => { if(!p.sku) p.sku = genSku(); }); }

    if(!sku) sku = isNew ? genSku() : (p.sku || genSku());
    if(price < cost && !d._warned){ d._warned = true; return err('Sotuv narxi kirim narxidan past. Agar to‘g‘ri bo‘lsa, «Saqlash» ni yana bosing.'); }
    if(isNew){
      const np = {id:nextId++, name, sku, barcodes:codes, cat, cost, price, min, stock:{b1:0,b2:0}};
      const init = Math.max(0, Math.floor(+$('f7').value || 0));

        addLog('tahrir', p, S.branch, 0, 0, 'Mahsulot ma’lumotlari o‘zgartirildi');
      Object.assign(p, {name, sku, barcodes:codes, cat, cost, price, min});
      toast('O‘zgarishlar saqlandi');
    }
    d.close(); render();
  };

      <div><label for="kq">Kelgan miqdor (dona)</label><input id="kq" type="number" min="1" inputmode="numeric"></div>
      <div><label for="kc">Yangi kirim narxi (ixtiyoriy)</label><input id="kc" type="number" min="0" inputmode="numeric" placeholder="${p.cost}"></div>
    </div>
    <div class="err" id="ke" role="alert"></div>
    <button class="btn" id="kok">Kirim qilish</button>`;
    $('kok').onclick = () => {
      const qty = Math.floor(+$('kq').value), nc = $('kc').value === '' ? p.cost : +$('kc').value;
      if(!(qty > 0)) { $('ke').textContent = 'Miqdorni 1 dan katta son bilan kiriting.'; return; }
      const before = stockOf(p);
      if(nc !== p.cost){ addLog('narx', p, S.branch, 0, 0, `Kirim narxi: ${fmt(p.cost)} → ${fmt(nc)}`); p.cost = nc; }
      p.stock[S.branch] = before + qty;
      addLog('kirim', p, S.branch, qty, qty*nc, `Qoldiq: ${fmt(before)} → ${fmt(before+qty)}`);
      toast(`${p.name}: +${fmt(qty)} dona kirim qilindi`);
      S.kpid = null; S.kq = ''; viewKirim();
    };
  }
  const rec = log.filter(l => l.type==='kirim' && l.branch===S.branch).slice(-5).reverse();
  $('krec').innerHTML = rec.length ? rec.map(logRow).join('') : '<div class="empty">Hali kirim yo‘q.</div>';
}

/* ---------- 2-BOSQICH: KASSA, SMENA, QAYTARISH ---------- */
const shifts = [], sales = [], refunds = [];
let shiftNo = 1, saleNo = 1001, refNo = 1;
const pById = id => products.find(p => p.id === id);
const openShift = () => shifts.find(s => !s.closedAt && s.login === S.user.login && s.branch === S.branch);
const isCancelled = id => refunds.some(r => r.type === 'cancel' && r.saleId === id);
const refundedSum = id => refunds.filter(r => r.saleId === id).reduce((a, r) => a + r.amount, 0);
const returnedQty = (id, pid) => refunds.filter(r => r.saleId === id).flatMap(r => r.items).filter(i => i.pid === pid).reduce((a, i) => a + i.qty, 0);
const saleNet = s => s.total - refundedSum(s.id);
const saleProfit = s => s.profit - refunds.filter(r => r.saleId === s.id).flatMap(r => r.items).reduce((a, i) => a + (i.amount - i.cost * i.qty), 0);
const sameDay = (a, b) => a.toDateString() === b.toDateString();
const sameMonth = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth();
const fdt = d => d.toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});

function shiftTotals(sh){
  const ss = sales.filter(s => s.shiftId === sh.id), rf = refunds.filter(r => r.shiftId === sh.id);
  const cashS = ss.reduce((a, s) => a + s.cash, 0), cardS = ss.reduce((a, s) => a + s.card, 0);
  const cashR = rf.filter(r => r.method === 'naqd').reduce((a, r) => a + r.amount, 0);
  const cardR = rf.filter(r => r.method === 'karta').reduce((a, r) => a + r.amount, 0);
  return {n: ss.length, cashS, cardS, cashR, cardR, expected: sh.opening + cashS - cashR};
}
function totalsHtml(sh, t){
  const row = (a, b, cls) => `<div class="sumrow ${cls || ''}"><span>${a}</span><span>${b}</span></div>`;
  return row('Boshlang‘ich pul', money(sh.opening)) + row('Savdolar soni', fmt(t.n) + ' ta') +
    row('Naqd tushum', money(t.cashS)) + row('Karta tushum', money(t.cardS)) +
    (t.cashR ? row('Qaytarilgan (naqd)', '− ' + money(t.cashR)) : '') +
    (t.cardR ? row('Qaytarilgan (karta)', '− ' + money(t.cardR)) : '') +
    row('Tizim hisoblagan naqd pul', money(t.expected), 'big') +
    (sh.closedAt ? row('Haqiqiy naqd pul', money(sh.counted)) +
      row(sh.diff > 0 ? 'Ortiqcha' : sh.diff < 0 ? 'Kamomad' : 'Farq', sh.diff === 0 ? 'Mos keladi' : money(Math.abs(sh.diff)), 'big') : '');
}

/* ----- KASSA ----- */
function calc(){
  const lines = S.cart.map(c => { const p = pById(c.pid); return {p, qty: c.qty, sum: p.price * c.qty}; });
  const sub = lines.reduce((a, l) => a + l.sum, 0), v = Math.max(0, +S.dval || 0);
  const disc = S.dtype === 'pct' ? Math.round(sub * Math.min(100, v) / 100) : Math.min(sub, v);
  const total = sub - disc, card = Math.min(total, Math.max(0, +S.card || 0)), cash = total - card;
  const given = +S.given || 0, change = given > cash ? given - cash : 0;
  return {lines, sub, disc, total, card, cash, given, change};
}

        <div><label for="cd">Karta orqali (so‘m)</label><input id="cd" type="number" min="0" inputmode="numeric" value="${S.card || ''}"></div>

function showResults(v){
  v = v.trim().toLowerCase();
  if(!v){ $('sr').innerHTML = '<div class="empty">Mahsulot qidiring yoki barcode skanerlang.</div>'; return; }
  const res = products.filter(p => p.name.toLowerCase().includes(v) || (p.sku || '').toLowerCase().includes(v) || p.barcodes.some(c => c.includes(v))).slice(0, 8);
  $('sr').innerHTML = res.length ? res.map(p => {
    const s = stockOf(p);
    return `<div class="row"><div><div class="nm">${esc(p.name)}</div><div class="sub">${p.barcodes.map(esc).join(', ')}</div></div>
      <div class="num"><b>${money(p.price)}</b><br><span class="sub">${fmt(s)} dona</span></div>
      <div class="act"><button class="btn sm" data-add="${p.id}" ${s <= 0 ? 'disabled' : ''}>${s <= 0 ? 'Tugagan' : 'Savatga qo‘shish'}</button></div></div>`;
  }).join('') : '<div class="empty">Bunday mahsulot topilmadi.</div>';
}
function addToCart(p){
  const s = stockOf(p), c = S.cart.find(x => x.pid === p.id);
  if(s <= 0){ sfx('extra'); return toast(`«${p.name}» omborda qolmagan`); }
  if(c){ if(c.qty + 1 > s){ sfx('extra'); return toast(`Omborda faqat ${fmt(s)} dona bor`); } c.qty++; }
  else S.cart.push({pid: p.id, qty: 1});
  sfx('ok'); renderCart();
}
function setQty(pid, n){
  n = Math.floor(n || 0);
  const p = pById(pid);
  if(n <= 0) S.cart = S.cart.filter(c => c.pid !== pid);
  else { if(n > stockOf(p)){ toast(`Omborda faqat ${fmt(stockOf(p))} dona bor`); n = stockOf(p); } S.cart.find(c => c.pid === pid).qty = n; }
  renderCart();
}
function renderCart(){
  $('cl').innerHTML = S.cart.length ? S.cart.map(c => {
    const p = pById(c.pid);
    return `<div class="cl"><div><div class="nm">${esc(p.name)}</div><div class="sub">${money(p.price)} · omborda ${fmt(stockOf(p))}</div></div>
      <div class="qty"><button class="btn sm ghost" data-m="${p.id}" aria-label="Kamaytirish">−</button><input data-q="${p.id}" type="number" min="1" value="${c.qty}" inputmode="numeric" aria-label="Miqdor"><button class="btn sm ghost" data-p="${p.id}" aria-label="Ko‘paytirish">+</button></div>
      <div class="num"><b>${money(p.price * c.qty)}</b><br><button class="btn sm ghost" data-x="${p.id}">Olib tashlash</button></div></div>`;
  }).join('') : '<div class="empty">Savat bo‘sh. Barcode skanerlang yoki mahsulot qidiring.</div>';
  updateTotals();
}
function updateTotals(){
  const c = calc(), row = (a, b, cls) => `<div class="sumrow ${cls || ''}"><span>${a}</span><span>${b}</span></div>`;
  $('ct').innerHTML = row('Mahsulotlar summasi', money(c.sub)) + (c.disc ? row('Chegirma', '− ' + money(c.disc)) : '') +
    row('Jami', money(c.total), 'big') + (c.card ? row('Karta', money(c.card)) : '') +
    row('Naqd to‘lanishi kerak', money(c.cash)) + (c.change ? row('Qaytim', money(c.change), 'big') : '');
  $('pb').disabled = !c.lines.length;
}
function checkout(){
  if(S.paying) return;
  if(SY.ro) return toast('Bu qurilma faqat ko‘rish rejimida. Sotish uchun chipni bosib, shu qurilmaga o‘ting.');                       // takroriy bosishdan himoya
  const sh = openShift(); if(!sh) return toast('Smena yopilgan. Avval smenani oching.');
  const c = calc(); if(!c.lines.length) return;
  for(const l of c.lines) if(l.qty > stockOf(l.p)) return sfx('extra') || toast(`«${l.p.name}»: omborda faqat ${fmt(stockOf(l.p))} dona qolgan`);
  if(c.given && c.given < c.cash) return toast('Mijoz bergan naqd summa yetarli emas');
  S.paying = true;
  try{
    const items = c.lines.map(l => Object.freeze({pid: l.p.id, name: l.p.name, code: l.p.barcodes[0], qty: l.qty, price: l.p.price, cost: l.p.cost, sum: l.sum}));
    const cost = items.reduce((a, i) => a + i.cost * i.qty, 0), no = saleNo++;
    const sale = Object.freeze({id: no, no, t: new Date(), branch: S.branch, login: S.user.login, cashier: S.user.name, shiftId: sh.id,
      items: Object.freeze(items), subtotal: c.sub, discount: c.disc, total: c.total, cash: c.cash, card: c.card, change: c.change, profit: c.total - cost});
    sales.push(sale);
    if(!S.online){ unsynced.add(sale.id); toast('Oflayn: savdo saqlandi, internet qaytganda serverga yuboriladi'); updateNet(); }
    c.lines.forEach(l => {
      const before = stockOf(l.p); l.p.stock[S.branch] = before - l.qty;
      addLog('sotuv', l.p, S.branch, l.qty, c.sub ? Math.round(l.sum * c.total / c.sub) : 0, `Chek № ${no}. Qoldiq: ${fmt(before)} → ${fmt(before - l.qty)}`);
    });
    S.cart = []; S.dval = 0; S.card = 0; S.given = 0;
    sfx('sale'); viewKassa(); showReceipt(sale);
  } finally { S.paying = false; }
}
function showReceipt(s){
  const d = $('dlg'), r = (a, b, cls) => `<div class="rr ${cls || ''}"><span>${a}</span><span>${b}</span></div>`;
  d.innerHTML = `<div id="receipt" class="rc"><div class="c"><b>CHEK № ${s.no}</b><br>${esc(bname(s.branch))}<br>${fdt(s.t)}<br>Kassir: ${esc(s.cashier)}</div><hr>` +
    s.items.map(i => `<div>${esc(i.name)}</div>${r(`${fmt(i.qty)} × ${fmt(i.price)}`, fmt(i.sum))}`).join('') + '<hr>' +
    r('Jami', fmt(s.subtotal)) + (s.discount ? r('Chegirma', '−' + fmt(s.discount)) : '') + r('To‘lov summasi', fmt(s.total), 'big') +
    (s.cash ? r('Naqd', fmt(s.cash)) : '') + (s.card ? r('Karta', fmt(s.card)) : '') + (s.change ? r('Qaytim', fmt(s.change)) : '') +

    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="btn ghost" id="rp">Chop etish</button><button class="btn" id="rx">Yopish</button></div>`;
  d.showModal(); $('rx').onclick = () => d.close(); $('rp').onclick = () => window.print();
}

/* ----- SOTUVLAR TARIXI, QAYTARISH, BEKOR QILISH ----- */
function saleState(s){
  if(isCancelled(s.id)) return ['b-zero', 'Bekor qilingan'];
  if(refunds.some(r => r.saleId === s.id)) return ['b-low', 'Qisman qaytarilgan'];
  return ['b-ok', 'Yakunlangan'];
}
function viewSotuvlar(){
  $('main').innerHTML = `<div class="bar">
    <input id="sq" type="search" placeholder="Chek raqami yoki mahsulot nomi" value="${esc(S.sq)}" aria-label="Qidirish">
    <select id="sd" aria-label="Davr"><option value="today" ${S.sd==='today'?'selected':''}>Bugun</option><option value="all" ${S.sd==='all'?'selected':''}>Barcha vaqt</option></select></div>
    <div class="muted" style="margin-bottom:8px">Qaytarish va bekor qilish asl savdoni o‘chirmaydi, alohida operatsiya sifatida saqlanadi.</div>
    <div id="sl"></div>`;
  const draw = () => {
    const r = R(), q = S.sq.trim().toLowerCase(), now = new Date();
    const rows = sales.filter(s => s.branch === S.branch && (!r.own || s.login === S.user.login) &&
      (S.sd === 'all' || sameDay(s.t, now)) &&
      (!q || String(s.no).includes(q) || s.items.some(i => i.name.toLowerCase().includes(q)))).slice().reverse();
    $('sl').innerHTML = rows.length ? rows.map(s => {
      const [cls, lbl] = saleState(s), net = saleNet(s), done = isCancelled(s.id) || s.items.every(i => returnedQty(s.id, i.pid) >= i.qty);
      return `<div class="row"><div><div class="nm">Chek № ${s.no}</div>
        <div class="sub">${fdt(s.t)} · ${esc(s.cashier)} · ${s.items.map(i => esc(i.name) + ' ×' + fmt(i.qty)).join(', ')}</div></div>
        <div class="num"><b>${money(s.total)}</b>${net !== s.total ? `<br><span class="sub">Qoldi: ${money(net)}</span>` : ''}<br><span class="badge ${cls}">${lbl}</span></div>
        <div class="act"><button class="btn sm ghost" data-rc="${s.id}">Chek</button>
        ${done ? '' : `<button class="btn sm ghost" data-rt="${s.id}">Qaytarish</button><button class="btn sm ghost" data-cn="${s.id}">Bekor qilish</button>`}</div></div>`;
    }).join('') : '<div class="empty">Savdolar yo‘q. Kassa bo‘limida savdo qilganingizda shu yerda ko‘rinadi.</div>';
  };
  $('sq').oninput = e => { S.sq = e.target.value; draw(); };
  $('sd').onchange = e => { S.sd = e.target.value; draw(); };
  $('sl').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    const find = id => sales.find(s => s.id === +id);
    if(b.dataset.rc) showReceipt(find(b.dataset.rc));
    if(b.dataset.rt) refundForm(find(b.dataset.rt), 'return');
    if(b.dataset.cn) refundForm(find(b.dataset.cn), 'cancel');
  };
  draw();
}
function refundForm(s, mode){
  const r = R(), d = $('dlg'), cancel = mode === 'cancel';
  const unit = i => i.price * s.total / (s.subtotal || 1);
  const rem = s.items.map(i => ({...i, left: i.qty - returnedQty(s.id, i.pid)})).filter(i => i.left > 0);
  if(!rem.length) return toast('Qaytariladigan mahsulot qolmagan');
  d.innerHTML = `<form id="rf" method="dialog"><h2 style="margin:0 0 4px">${cancel ? 'Savdoni bekor qilish' : 'Mahsulotni qaytarish'} · Chek № ${s.no}</h2>` +
    (cancel ? '<div class="muted">Qolgan barcha mahsulotlar omborga qaytadi va pul mijozga qaytariladi.</div>' :
      rem.map(i => `<div class="cl"><div><div class="nm">${esc(i.name)}</div><div class="sub">Qaytarish mumkin: ${fmt(i.left)} dona</div></div><div></div>
        <input type="number" min="0" max="${i.left}" value="0" data-rq="${i.pid}" inputmode="numeric" aria-label="${esc(i.name)} miqdori"></div>`).join('')) +
    `<label for="rm">Pul qaytarish usuli</label><select id="rm"><option value="naqd">Naqd</option><option value="karta">Karta</option></select>
    <label for="rr">Sababi</label><input id="rr" placeholder="Masalan: mijoz fikridan qaytdi">` +
    (r.refund ? '' : `<div class="alert warn" style="margin-top:12px">Bu amalni administrator tasdiqlashi kerak.</div>
      <div class="two"><div><label for="al">Administrator logini</label><input id="al" autocapitalize="none"></div><div><label for="ap">Parol</label><input id="ap" type="password"></div></div>`) +
    `<div class="err" id="re" role="alert"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button type="button" class="btn ghost" id="rcn">Orqaga</button><button type="submit" class="btn">${cancel ? 'Savdoni bekor qilish' : 'Qaytarishni tasdiqlash'}</button></div></form>`;
  d.showModal();
  $('rcn').onclick = () => d.close();
  $('rf').onsubmit = async e => {
    e.preventDefault();
    const err = m => { $('re').textContent = m; };
    let appr = S.user;
    if(!r.refund){
      const cand = users.find(u => !u.off && u.login === $('al').value.trim().toLowerCase() && roles[u.role].refund && (roles[u.role].all || u.branch === S.branch));
      if(!cand) return err('Administrator logini yoki paroli noto‘g‘ri.');
      try { await api('verify', {login: cand.login, pass: $('ap').value}, false); }
      catch(x){ return err(x.net ? 'Serverga ulanib bo‘lmadi.' : 'Administrator logini yoki paroli noto‘g‘ri.'); }
      appr = cand;
    }
    const reason = $('rr').value.trim(); if(!reason) return err('Sababni yozing.');
    let items = [];
    if(cancel) items = rem.map(i => ({pid: i.pid, name: i.name, qty: i.left, cost: i.cost, amount: Math.round(unit(i) * i.left)}));
    else for(const i of rem){
      const q = Math.floor(+document.querySelector(`[data-rq="${i.pid}"]`).value || 0);
      if(q > i.left) return err(`«${i.name}»: ko‘pi bilan ${fmt(i.left)} dona qaytarish mumkin.`);
      if(q > 0) items.push({pid: i.pid, name: i.name, qty: q, cost: i.cost, amount: Math.round(unit(i) * q)});
    }
    if(!items.length) return err('Qaytariladigan mahsulot miqdorini kiriting.');
    let amount = items.reduce((a, i) => a + i.amount, 0);
    if(cancel){ const target = s.total - refundedSum(s.id); items[0].amount += target - amount; amount = target; }
    const sh = openShift();
    refunds.push(Object.freeze({id: refNo++, type: cancel ? 'cancel' : 'return', saleId: s.id, t: new Date(), user: S.user.name, approver: appr.name,
      shiftId: sh ? sh.id : null, items: Object.freeze(items.map(i => Object.freeze(i))), amount, method: $('rm').value, reason}));
    items.forEach(i => {
      const p = pById(i.pid), before = p.stock[s.branch] || 0; p.stock[s.branch] = before + i.qty;
      addLog(cancel ? 'bekor' : 'qaytarish', p, s.branch, i.qty, i.amount, `Chek № ${s.no}. Sabab: ${reason}. Tasdiqladi: ${appr.name}`);
    });
    d.close(); toast(`${money(amount)} mijozga qaytariladi`); viewSotuvlar();
  };
}

/* ----- INVENTARIZATSIYA ----- */
const invSummary = inv => {
  let short = 0, shortSum = 0, over = 0, overSum = 0;
  (inv.items || []).forEach(i => { if(i.diff < 0){ short += -i.diff; shortSum += -i.diff * i.cost; } else if(i.diff > 0){ over += i.diff; overSum += i.diff * i.cost; } });
  return {short, shortSum, over, overSum};
};
const invStatus = {pending: ['b-low', 'Tasdiq kutilmoqda'], approved: ['b-ok', 'Tasdiqlangan'], rejected: ['b-zero', 'Rad etilgan'], discarded: ['b-zero', 'Bekor qilingan']};
const prevDiff = (inv, pid) => {
  const prev = inventories.filter(x => x.branch === inv.branch && x.status === 'approved' && x.id < inv.id).reverse().find(x => x.items.some(i => i.pid === pid));
  return prev ? prev.items.find(i => i.pid === pid).diff : null;
};

/* ----- TRANSFER ----- */
const trStatus = {yolda: ['b-low', 'Yo‘lda'], qabul: ['b-ok', 'Qabul qilingan'], bekor: ['b-zero', 'Bekor qilingan']};
function viewTransfer(){
  const r = R();
  if(S.trdBranch !== S.branch){ S.trd = []; S.trTo = ''; S.trdBranch = S.branch; }
  const others = branches.filter(b => b.id !== S.branch);
  if(!S.trTo || S.trTo === S.branch) S.trTo = others[0].id;
  let h = '';
  if(r.stockops) h += `<div class="card"><h2 style="margin:0 0 4px">Yangi transfer</h2>
    <div class="muted">${esc(bname(S.branch))} omboridan yuboriladi. Yuborilgan mahsulot qabul qilinguncha «yo‘lda» holatida turadi.</div>
    <label for="tt">Qabul qiluvchi filial</label><select id="tt">${others.map(b => `<option value="${b.id}" ${b.id === S.trTo ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select>
    <label for="ts">Barcode skanerlang yoki nomini yozing</label><input id="ts" autocomplete="off" inputmode="search" placeholder="Mahsulot qo‘shish">
    <div id="tr" style="margin-top:8px"></div>
    <h3 style="margin:12px 0 4px">Yuboriladigan mahsulotlar</h3><div id="td"></div>
    <div class="err" id="te" role="alert"></div>
    <button class="btn" id="tsend">Transferni yuborish</button></div>`;
  h += '<h3>Transferlar</h3><div id="tl"></div>';
  $('main').innerHTML = h;
  if(r.stockops){
    const addDraft = p => {
      if(stockOf(p) <= 0) return toast(`«${p.name}» omborda qolmagan`);
      const c = S.trd.find(x => x.pid === p.id);
      if(c){ if(c.qty + 1 > stockOf(p)) return toast(`Omborda faqat ${fmt(stockOf(p))} dona bor`); c.qty++; } else S.trd.push({pid: p.id, qty: 1});
      drawDraft();
    };
    const drawDraft = () => {
      $('td').innerHTML = S.trd.length ? S.trd.map(c => { const p = pById(c.pid); return `<div class="cl"><div><div class="nm">${esc(p.name)}</div><div class="sub">Omborda: ${fmt(stockOf(p))} dona</div></div>
        <input type="number" min="1" max="${stockOf(p)}" value="${c.qty}" data-dq="${p.id}" inputmode="numeric" aria-label="${esc(p.name)} miqdori"><button class="btn sm ghost" data-dx="${p.id}">Olib tashlash</button></div>`; }).join('')
        : '<div class="empty">Mahsulot qo‘shilmagan.</div>';
    };
    $('tt').onchange = e => { S.trTo = e.target.value; };
    $('ts').oninput = e => { $('tr').innerHTML = searchList(e.target.value, 'data-ta', 'Qo‘shish'); };
    $('ts').onkeydown = e => { if(e.key !== 'Enter') return; e.preventDefault(); const p = findByInput(e.target.value); if(p){ addDraft(p); e.target.value = ''; $('tr').innerHTML = ''; } else toast('Mahsulot topilmadi'); };
    $('tr').onclick = e => { const b = e.target.closest('[data-ta]'); if(b){ addDraft(pById(+b.dataset.ta)); $('ts').value = ''; $('tr').innerHTML = ''; $('ts').focus(); } };
    $('td').onchange = e => { if(e.target.dataset.dq){ const p = pById(+e.target.dataset.dq); let n = Math.floor(+e.target.value || 0); if(n > stockOf(p)){ toast(`Omborda faqat ${fmt(stockOf(p))} dona bor`); n = stockOf(p); } if(n <= 0) S.trd = S.trd.filter(x => x.pid !== p.id); else S.trd.find(x => x.pid === p.id).qty = n; drawDraft(); } };
    $('td').onclick = e => { const b = e.target.closest('[data-dx]'); if(b){ S.trd = S.trd.filter(x => x.pid !== +b.dataset.dx); drawDraft(); } };
    $('tsend').onclick = sendTransfer;
    drawDraft();
  }
  drawTransfers();
}
function sendTransfer(){
  if(S.paying) return;
  if(!S.trd.length) return $('te').textContent = 'Kamida bitta mahsulot qo‘shing.';
  for(const c of S.trd){ const p = pById(c.pid); if(c.qty > stockOf(p)) return $('te').textContent = `«${p.name}»: omborda faqat ${fmt(stockOf(p))} dona bor.`; }
  S.paying = true;
  try{
    const no = trNo++, items = S.trd.map(c => { const p = pById(c.pid); return Object.freeze({pid: p.id, name: p.name, cost: p.cost, qty: c.qty}); });
    const t = {id: no, no: 'T-' + String(no).padStart(3, '0'), from: S.branch, to: S.trTo, createdBy: S.user.name, createdAt: new Date(), items: Object.freeze(items), status: 'yolda'};
    transfers.push(t);
    items.forEach(i => { const p = pById(i.pid), b = stockOf(p); p.stock[t.from] = b - i.qty;
      addLog('transfer', p, t.from, i.qty, i.qty * i.cost, `${t.no}: ${bname(t.from)} → ${bname(t.to)}, yo‘lda. Qoldiq: ${fmt(b)} → ${fmt(b - i.qty)}`); });
    S.trd = []; toast(`${t.no} yuborildi`); viewTransfer();
  } finally { S.paying = false; }
}
function drawTransfers(){
  const r = R(), rows = transfers.filter(t => t.from === S.branch || t.to === S.branch).slice().reverse();

async function cancelTransfer(t){
  if(!(await ask(`${t.no} bekor qilinsinmi?`, 'Mahsulotlar yuboruvchi omborga qaytadi.', 'Ha, bekor qilish', 'Orqaga'))) return;
  t.items.forEach(i => { const p = pById(i.pid), b = p.stock[t.from] || 0; p.stock[t.from] = b + i.qty;
    addLog('transfer', p, t.from, i.qty, i.qty * i.cost, `${t.no} bekor qilindi, mahsulot omborga qaytdi. Qoldiq: ${fmt(b)} → ${fmt(b + i.qty)}`); });
  t.status = 'bekor'; t.cancelledBy = S.user.name; Object.freeze(t); toast(`${t.no} bekor qilindi`); viewTransfer();
}
function receiveForm(t){
  const d = $('dlg');
  d.innerHTML = `<form id="rcf" method="dialog"><h2 style="margin:0 0 4px">${t.no} ni qabul qilish</h2>
    <div class="muted">Haqiqatda kelgan miqdorni kiriting. Farq bo‘lsa, tizim uni kam yoki ortiqcha deb belgilaydi.</div>
    ${t.items.map(i => `<div class="cl"><div><div class="nm">${esc(i.name)}</div><div class="sub">Yuborilgan: ${fmt(i.qty)} dona</div></div><div></div>
      <input type="number" min="0" value="${i.qty}" data-rv="${i.pid}" inputmode="numeric" aria-label="${esc(i.name)} qabul miqdori"></div>`).join('')}
    <div class="err" id="rce" role="alert"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button type="button" class="btn ghost" id="rcn">Orqaga</button><button type="submit" class="btn">Qabulni tasdiqlash</button></div></form>`;
  d.showModal(); $('rcn').onclick = () => d.close();
  $('rcf').onsubmit = e => {
    e.preventDefault();
    const got = {};
    for(const i of t.items){ const v = document.querySelector(`[data-rv="${i.pid}"]`).value; if(v === '' || +v < 0) return $('rce').textContent = 'Barcha miqdorlarni kiriting.'; got[i.pid] = Math.floor(+v); }
    t.items.forEach(i => {
      const p = pById(i.pid), b = p.stock[t.to] || 0, n = got[i.pid]; p.stock[t.to] = b + n;
      const diff = n - i.qty;
      addLog('transfer', p, t.to, n, n * i.cost, `${t.no} qabul qilindi. ${diff < 0 ? 'KAM keldi: ' + fmt(-diff) : diff > 0 ? 'ORTIQCHA keldi: ' + fmt(diff) : 'Miqdor mos'}. Qoldiq: ${fmt(b)} → ${fmt(b + n)}`);
    });
    t.received = got; t.status = 'qabul'; t.receivedBy = S.user.name; t.receivedAt = new Date(); Object.freeze(t);
    d.close(); toast(`${t.no} qabul qilindi`); viewTransfer();
  };
}

const unsynced = new Set(), snapshots = [];
let bkTimer = null;
const DAY = 86400000;
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
function rangeOf(k){
  const now = new Date(), t0 = startOfDay(now);
  if(k === 'today') return [t0, new Date(+t0 + DAY)];
  if(k === 'week') return [new Date(+t0 - 6 * DAY), new Date(+t0 + DAY)];
  if(k === 'month') return [new Date(now.getFullYear(), now.getMonth(), 1), new Date(now.getFullYear(), now.getMonth() + 1, 1)];
  return [new Date(0), new Date(8.64e15)];
}
const rangeNames = {today: 'Bugun', week: 'Oxirgi 7 kun', month: 'Shu oy', all: 'Barcha vaqt'};

/* ----- Hisob-kitob ----- */
function periodStats(b, [from, to]){
  const all = sales.filter(s => s.branch === b && s.t >= from && s.t < to), live = all.filter(s => !isCancelled(s.id));
  const gross = all.reduce((a, s) => a + s.total, 0), refSum = all.reduce((a, s) => a + refundedSum(s.id), 0);
  const ids = new Set(all.map(s => s.id)), rf = refunds.filter(x => ids.has(x.saleId));
  const cash = all.reduce((a, s) => a + s.cash, 0) - rf.filter(x => x.method === 'naqd').reduce((a, x) => a + x.amount, 0);
  const card = all.reduce((a, s) => a + s.card, 0) - rf.filter(x => x.method === 'karta').reduce((a, x) => a + x.amount, 0);
  const profit = all.reduce((a, s) => a + saleProfit(s), 0);
  const exp = expenses.filter(x => x.branch === b && !voided[x.id] && x.t >= from && x.t < to).reduce((a, x) => a + x.amount, 0);
  return {n: live.length, gross, refSum, revenue: gross - refSum, disc: live.reduce((a, s) => a + s.discount, 0),
    units: all.reduce((a, s) => a + s.items.reduce((x, i) => x + i.qty - returnedQty(s.id, i.pid), 0), 0), cash, card, profit, exp, net: profit - exp};
}
function productSales(b, [from, to]){
  const m = new Map(products.map(p => [p.id, 0]));
  sales.filter(s => s.branch === b && s.t >= from && s.t < to).forEach(s => s.items.forEach(i => m.set(i.pid, (m.get(i.pid) || 0) + i.qty - returnedQty(s.id, i.pid))));
  return products.map(p => ({p, qty: m.get(p.id) || 0})).sort((a, c) => c.qty - a.qty);
}
const statBox = (a, b) => `<div class="stat"><small>${a}</small><strong>${b}</strong></div>`;
const rrow = (a, b, cls) => `<div class="sumrow ${cls || ''}"><span>${a}</span><span>${b}</span></div>`;

/* ----- EXCEL / PDF ----- */
function download(name, blob){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportRows(file, sheet, rows){
  if(!rows.length) return toast('Yuklab olish uchun ma’lumot yo‘q');
  if(window.XLSX){
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), sheet);
    XLSX.writeFile(wb, file + '.xlsx'); toast('Excel fayl yuklab olindi');
  } else {
    const keys = Object.keys(rows[0]), cell = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const csv = '\ufeff' + [keys.map(cell).join(',')].concat(rows.map(x => keys.map(k => cell(x[k])).join(','))).join('\r\n');
    download(file + '.csv', new Blob([csv], {type: 'text/csv;charset=utf-8'})); toast('Excel kutubxonasi yuklanmadi, CSV fayl yuklab olindi (Excel ochadi)');
  }
}
function exportKind(k){
  const r = R(), b = S.branch, d = x => x.toLocaleString('ru-RU'), tag = new Date().toISOString().slice(0, 10);
  if(k === 'ombor') exportRows('ombor-' + tag, 'Ombor', products.map(p => {
    const o = {'Mahsulot': p.name, 'Artikul': p.sku, 'Barcode': p.barcodes.join(', '), 'Kategoriya': p.cat};
    if(r.cost) o['Kirim narxi'] = p.cost; o['Sotuv narxi'] = p.price; o['Qoldiq'] = stockOf(p); o['Minimal qoldiq'] = p.min;
    if(r.cost) o['Umumiy qiymat (kirim)'] = stockOf(p) * p.cost; return o; }));
  if(k === 'sotuv') exportRows('sotuvlar-' + tag, 'Sotuvlar', sales.filter(s => s.branch === b).map(s => ({
    'Chek': s.no, 'Sana': d(s.t), 'Kassir': s.cashier, 'Mahsulotlar': s.items.map(i => i.name + ' x' + i.qty).join('; '), 'Jami': s.total, 'Chegirma': s.discount,
    'Naqd': s.cash, 'Karta': s.card, 'Qaytarilgan': refundedSum(s.id), 'Holat': saleState(s)[1], 'Foyda': saleProfit(s)})));

    'Sana': x.t.toLocaleDateString('ru-RU'), 'Kategoriya': x.cat, 'Summa': x.amount, 'Izoh': x.note, 'Kiritdi': x.user, 'Holat': voided[x.id] ? 'Bekor qilingan' : 'Faol'})));
  if(k === 'tarix') exportRows('tarix-' + tag, 'Tarix', log.filter(l => l.branch === b).map(l => ({

function b64decode(str){
  str = String(str).replace(/-/g, '+').replace(/_/g, '/'); while(str.length % 4) str += '=';
  const bin = atob(str), bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(bytes));
}

function readImg(file, max, q){
  return new Promise((res, rej) => {
    if(!file || !file.type.startsWith('image/')) return rej();
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(q ? c.toDataURL('image/jpeg', q) : c.toDataURL('image/png')); }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* ----- Tovarlarni Excel/CSV dan yuklash ----- */
function parseCsv(t){
  t = t.replace(/^\ufeff/, ''); let sp = /^sep=(.)\r?\n/i.exec(t); if(sp) t = t.slice(sp[0].length); const l1 = t.split('\n')[0], dl = sp ? sp[1] : (l1.match(/;/g) || []).length > (l1.match(/,/g) || []).length ? ';' : ',';
  const out = []; let row = [], c = '', q = false;
  for(let i = 0; i < t.length; i++){ const ch = t[i];
    if(q){ if(ch === '"'){ if(t[i + 1] === '"'){ c += '"'; i++; } else q = false; } else c += ch; }
    else if(ch === '"') q = true;
    else if(ch === dl){ row.push(c); c = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && t[i + 1] === '\n') i++; row.push(c); out.push(row); row = []; c = ''; }
    else c += ch; }
  if(c || row.length){ row.push(c); out.push(row); } return out;
}
async function readTable(f){
  if(/\.csv$/i.test(f.name)) return parseCsv(await f.text());
  if(!window.XLSX) throw new Error('Excel kutubxonasi yuklanmadi (internet kerak). Faylni CSV qilib saqlab, qayta tanlang.');
  const wb = XLSX.read(await f.arrayBuffer()); return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1});
}

const IMP_F = [['name', 'Nomi'], ['sku', 'Artikul'], ['code', 'Barcode'], ['cat', 'Kategoriya (katalog)'], ['cost', 'Kirim narxi'], ['price', 'Sotuv narxi'], ['min', 'Minimal qoldiq'], ['qty', 'Qoldiq']];
const IMP_REQ = ['name', 'cat', 'cost', 'price'];
const IMP_AL = {name: ['nomi', 'nom', 'mahsulot', 'mahsulot nomi', 'tovar', 'tovar nomi', 'name', 'product', 'наименование', 'название', 'товар'], sku: ['artikul', 'sku', 'article', 'артикул'],
  code: ['barcode', 'bar code', 'shtrix', 'shtrixkod', 'shtrix kod', 'штрихкод', 'ean'], cat: ['kategoriya', 'guruh', 'category', 'katalog', 'catalog', 'категория', 'группа'],
  cost: ['kirim narxi', 'kirim narx', 'kirim', 'tannarx', 'cost', 'себестоимость', 'закупка'], price: ['sotuv narxi', 'sotuv narx', 'sotuv', 'selling price', 'розница'],
  min: ['minimal qoldiq', 'minimal', 'min'], qty: ['qoldiq', 'miqdor', 'soni', 'qty', 'quantity', 'количество', 'остаток']};
const IMP_AMBIG = ['narx', 'narxi', 'price', 'цена', 'summa'];   /* aniq emas: kirimmi yoki sotuvmi? dastur so‘raydi */
const hn = h => String(h ?? '').toLowerCase().replace(/[.:*_]+/g, ' ').replace(/\s+/g, ' ').trim();
function impGuess(h){
  const k = hn(h);
  for(const f in IMP_AL) if(IMP_AL[f].includes(k)) return {f, an: ''};
  const known = [...new Set(products.flatMap(p => Object.keys(p.variant || {})))].find(n => hn(n) === k);
  return known ? {f: 'attr', an: known} : {f: '', an: ''};
}
const impNum = s => { s = String(s).replace(/\s/g, '').replace(',', '.'); return /^\d+(\.\d+)?$/.test(s) ? +s : NaN; };
function impValidate(T, M){
  const errs = [], items = [], ci = {}, attrs = [];
  M.forEach((m, i) => { if(m.f === 'attr') attrs.push({i, name: m.an.trim()}); else if(m.f && m.f !== 'skip') ci[m.f] = i; });
  const hd = f => T.head[ci[f]] || IMP_F.find(x => x[0] === f)[1];
  const seenName = new Map(), seenCode = new Map();
  T.rows.forEach((r, k) => {
    if(!r.some(x => x !== '')) return;
    const row = k + 2, g = f => ci[f] === undefined ? '' : r[ci[f]] || '', bad = (f, msg) => errs.push({row, col: hd(f), msg});
    const base = g('name'), cat = g('cat'), codes = parseCodes(g('code'));
    if(!base) bad('name', 'Nomi bo‘sh. Mahsulot nomi majburiy.');
    if(!cat) bad('cat', 'Kategoriya (katalog) bo‘sh. Majburiy.');
    let cost = NaN, price = NaN, min, qty = 0;
    for(const f of ['cost', 'price']){
      const raw = g(f), v = impNum(raw);
      if(raw === '') bad(f, `${IMP_F.find(x => x[0] === f)[1]} bo‘sh. Majburiy.`);
      else if(isNaN(v)) bad(f, `Son bo‘lishi kerak, lekin «${raw}» yozilgan.`);
      else if(f === 'cost') cost = Math.round(v); else price = Math.round(v);
    }
    if(!isNaN(price) && price <= 0) bad('price', 'Sotuv narxi 0 dan katta bo‘lishi kerak.');
    if(!isNaN(cost) && !isNaN(price) && price < cost) bad('price', `Sotuv narxi (${fmt(price)}) kirim narxidan (${fmt(cost)}) past bo‘lmasligi kerak.`);
    for(const f of ['min', 'qty']){
      const raw = g(f); if(raw === '') continue; const v = impNum(raw);
      if(isNaN(v) || v !== Math.floor(v)) bad(f, `Butun son bo‘lishi kerak, lekin «${raw}» yozilgan.`); else if(f === 'min') min = v; else qty = v;
    }
    const av = {}; attrs.forEach(a => { const v = r[a.i]; if(v) av[a.name] = v; });
    const vals = Object.values(av), full = base ? base + (vals.length ? ' · ' + vals.join(' · ') : '') : '', key = full.toLowerCase();
    if(base){
      if(seenName.has(key)) bad('name', `«${full}» ${seenName.get(key)}-qatorda ham bor (takror). Bir xil tovar ikki marta yozilmasin.`); else seenName.set(key, row);
    }
    codes.forEach(c => {
      const o = seenCode.get(c);
      if(o && o.key !== key) bad('code', `Barcode ${c} ${o.row}-qatordagi «${o.name}» da ham bor.`); else if(!o) seenCode.set(c, {row, key, name: full});
    });
    const ex = full ? products.find(x => x.name.trim().toLowerCase() === key) : null;
    codes.forEach(c => { const o = products.find(x => x !== ex && x.barcodes.includes(c)); if(o) bad('code', `Barcode ${c} omborda boshqa tovarda («${o.name}») bor.`); });
    items.push({row, base, full, sku: g('sku'), codes, cat, cost, price, min, qty, av, ex});
  });
  if(!items.length && !errs.length) errs.push({row: '—', col: '', msg: 'Faylda tovar qatorlari topilmadi.'});
  return {errs, items, attrNames: attrs.map(a => a.name)};
}
function impApply(items){
  const grp = new Map(); let neu = 0, merged = 0;
  items.forEach(it => {
    if(it.ex){
      const ex = it.ex; ex.barcodes.push(...it.codes.filter(c => !ex.barcodes.includes(c)));
      if(it.qty){ ex.stock[S.branch] = (ex.stock[S.branch] || 0) + it.qty; addLog('kirim', ex, S.branch, it.qty, it.qty * ex.cost, 'Importdan qoldiqqa qo‘shildi'); }
      merged++; return;
    }
    let sku = it.sku; if(!sku){ if(Object.keys(it.av).length){ if(!grp.has(it.base.toLowerCase())) grp.set(it.base.toLowerCase(), genSku()); sku = grp.get(it.base.toLowerCase()); } else sku = genSku(); }
    const np = {id: nextId++, name: it.full, sku, barcodes: it.codes.length ? it.codes : [genBarcode()], cat: it.cat, cost: it.cost, price: it.price, min: it.min === undefined ? 5 : it.min, stock: {b1: 0, b2: 0}};

    if(it.qty) addLog('kirim', np, S.branch, it.qty, it.qty * np.cost, 'Boshlang‘ich qoldiq (import)'); neu++;
  });

}

const EL = ['0001101', '0011001', '0010011', '0111101', '0100011', '0110001', '0101111', '0111011', '0110111', '0001011'], EPAR = ['LLLLLL', 'LLGLGG', 'LLGGLG', 'LLGGGL', 'LGLLGG', 'LGGLLG', 'LGGGLL', 'LGLGLG', 'LGLGGL', 'LGGLGL'];
function eanBits(c){
  const R = EL.map(x => x.replace(/[01]/g, m => m === '0' ? '1' : '0')), G = R.map(x => [...x].reverse().join(''));
  let b = '101'; [...c.slice(1, 7)].forEach((d, i) => b += (EPAR[+c[0]][i] === 'L' ? EL : G)[+d]); b += '01010'; [...c.slice(7)].forEach(d => b += R[+d]); return b + '101';
}
const eanSvg = c => { if(!(/^\d{13}$/.test(c) && ean13(c.slice(0, 12)) === c)) return `<div style="font:12px monospace;padding:14px 0">${esc(c)}</div>`; const b = eanBits(c);
  return `<svg viewBox="0 0 ${b.length} 40" width="140" height="44" preserveAspectRatio="none" fill="#000" aria-hidden="true">${[...b].map((x, i) => x === '1' ? `<rect x="${i}" width="1" height="40"/>` : '').join('')}</svg><div style="font:11px monospace;letter-spacing:1px">${c}</div>`; };

const SND = {on: true, vol: .6};
let actx = null;
function tone(f, t, d, type, g){
  const o = actx.createOscillator(), v = actx.createGain(); o.type = type; o.frequency.value = f;
  v.gain.setValueAtTime(.0001, t); v.gain.exponentialRampToValueAtTime(Math.max(.0002, g * SND.vol), t + .012); v.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(v); v.connect(actx.destination); o.start(t); o.stop(t + d + .03);
}
function sfx(kind){
  if(!SND.on) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if(actx.state === 'suspended') actx.resume();
    const t = actx.currentTime, P = {
      ok: () => { tone(1568, t, .07, 'sine', .45); tone(2093, t + .06, .1, 'sine', .45); },
      error: () => { tone(150, t, .22, 'sawtooth', .5); tone(110, t + .24, .38, 'sawtooth', .5); },
      extra: () => { [660, 990, 660, 990].forEach((f, i) => tone(f, t + i * .13, .12, 'square', .3)); },
      sale: () => { [1046, 1318, 1568, 2093].forEach((f, i) => tone(f, t + i * .07, .22, 'triangle', .5)); }
    }; (P[kind] || P.ok)();
  } catch(e) {}
}

function h53(str){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i = 0, ch; i < str.length; i++){ ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }

  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return String(4294967296 * (2097151 & h2) + (h1 >>> 0));
}

  const js = stateJson(), hh = h53(js);
  if(hh === SY.hash){ unsynced.clear(); updateNet(); return; }

  try {
    const r = await api('push', {baseRev: SY.rev, device: DEV, state: js});

    else { SY.err = x.net ? 'Internet yo‘q · keyin yuboriladi' : 'Sheets xatosi: ' + x.message; setTimeout(pushNow, 20000); }

}

  fixSku(); applyBrand(); ping('ochildi'); setInterval(() => ping('davriy'), VENDOR.every);
  setInterval(() => { if(BRAND.set) saveData(); }, 3000);
  addEventListener('pagehide', () => { if(BRAND.set) saveData(); });
}
function boot(){
  const b = lsGet(LS.brand);
  if(b){ try { Object.assign(BRAND, JSON.parse(b)); } catch(e) {} }
  const d = lsGet(LS.data); if(d && BRAND.set){ try { restoreBackup(d); } catch(e) {} }
  const mu = location.hash.match(/#u=([^&]+)/);      /* xodim qurilmasi uchun: havola ichida Sheets manzili */
  if(mu){
    try { const u = decodeURIComponent(mu[1]); if(SCRIPT_RE.test(u)){ API.url = u; lsSet(SHEETS_KEY, u); API.tok = ''; lsSet(TOK_KEY, ''); } } catch(e) {}
    history.replaceState(null, '', location.pathname + location.search);
  }
  initApp();
  startSession();
}

/* ----- OVOZLI YORDAMCHI ----- */
const nrm = s => String(s).toLowerCase().replace(/[‘’ʻ`´ʼ']/g, '');
function answerQuery(raw){
  const r = R(), q = nrm(raw), has = re => re.test(q), deny = 'Bu ma’lumotni ko‘rishga sizda ruxsat yo‘q.';
  const per = has(/hafta|недел/) ? 'week' : has(/oylik|\boy\b|месяц/) ? 'month' : 'today';
  const pn = {today: 'Bugungi', week: 'Oxirgi 7 kunlik', month: 'Shu oylik'}[per], rng = rangeOf(per);
  const sold = () => productSales(S.branch, rng).filter(x => x.qty > 0);
  if(has(/xarajat|расход/)) return r.report ? `${pn} xarajatlar: ${money(periodStats(S.branch, rng).exp)}.` : deny;
  if(has(/foyda|прибыл/)){ if(!(r.report && r.cost)) return deny; const x = periodStats(S.branch, rng); return `${pn} foyda: ${money(x.profit)}. Xarajatlardan keyingi sof foyda: ${money(x.net)}.`; }
  if(has(/eng\s*kop|kop\s*sot|больше всего|самый/)){ if(!r.report) return deny; const t = sold()[0]; return t ? `Eng ko‘p sotilgani: ${t.p.name}, ${fmt(t.qty)} dona.` : 'Bu davrda hali sotuv bo‘lmagan.'; }
  if(has(/eng\s*kam|kam\s*sot/)){ if(!r.report) return deny; const l = sold(); const t = l[l.length - 1]; return t ? `Eng kam sotilgani: ${t.p.name}, ${fmt(t.qty)} dona.` : 'Bu davrda hali sotuv bo‘lmagan.'; }
  if(has(/kam\s*qol|tugay|tugab|заканчив|мало/)){
    const low = products.filter(p => status(p) !== 'ok');
    return low.length ? 'Kam qolganlar: ' + low.map(p => `${p.name} (${fmt(stockOf(p))} dona)`).join(', ') + '.' : 'Kam qoldiqli mahsulot yo‘q.';
  }
  if(has(/savdo|sotuv|продаж|выручк|tushum/)){ if(!r.report) return deny; const x = periodStats(S.branch, rng); return `${pn} savdo: ${money(x.revenue)}, ${fmt(x.n)} ta chek.`; }
  const qt = q.split(/[^a-zа-я0-9]+/).filter(Boolean);
  const hit = products.filter(p => nrm(p.name).split(/[^a-zа-я0-9]+/).filter(t => t.length >= 3).some(t => qt.some(w => w.startsWith(t)))).slice(0, 3);
  if(hit.length) return hit.map(p => r.all ? `${p.name}: ` + branches.map(b => `${b.name} — ${fmt(p.stock[b.id] || 0)} dona`).join(', ') + '.' : `${p.name}: omborda ${fmt(stockOf(p))} dona bor.`).join(' ');
  if(has(/qoldi|qancha|nechta|ostat|остат|сколько/)) return products.map(p => `${p.name} — ${fmt(stockOf(p))} dona`).join('; ') + '.';
  return 'Savolni tushunmadim. Masalan: «Bugungi savdo qancha?», «Omborda nechta Snickers bor?», «Qaysi mahsulot eng ko‘p sotildi?»';
}
function speak(t){
  if(!S.vs || !('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(t); u.lang = S.vlang; speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function viewOvoz(){
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  $('main').innerHTML = `<div class="card"><h2 style="margin:0 0 4px">Ovozli yordamchi</h2>
    <div class="muted">Mikrofon tugmasini bosib savol bering yoki pastga yozing.</div>
    <div class="two"><div><label for="vlang">Til</label><select id="vlang"><option value="uz-UZ" ${S.vlang === 'uz-UZ' ? 'selected' : ''}>O‘zbekcha</option><option value="ru-RU" ${S.vlang === 'ru-RU' ? 'selected' : ''}>Ruscha</option></select></div>
    <div><label class="chk" style="margin-top:30px"><input type="checkbox" id="vsp" ${S.vs ? 'checked' : ''}> Javobni ovoz bilan o‘qish</label></div></div>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="btn" id="mic" ${Rec ? '' : 'disabled'}>Gapirish</button>
      <input id="vq" placeholder="Yoki savolni yozing" aria-label="Savol" style="flex:1"><button class="btn ghost" id="vgo">Yuborish</button></div>
    ${Rec ? '' : '<div class="muted" style="margin-top:8px">Bu brauzer ovozni tanimaydi (Chrome tavsiya etiladi). Savolni yozib bering.</div>'}
    <div class="sub" style="margin-top:10px">Masalan: «Bugungi savdo qancha?», «Bugungi foyda qancha?», «Omborda nechta Snickers bor?», «Qaysi mahsulotdan qancha qoldi?», «Bugun qaysi mahsulot eng ko‘p sotildi?»</div></div>
    <div id="vl"></div>`;
  const ask1 = text => {
    text = text.trim(); if(!text) return;
    const a = answerQuery(text);
    $('vl').insertAdjacentHTML('afterbegin', `<div class="card"><div class="muted">${esc(text)}</div><div style="margin-top:4px"><b>${esc(a)}</b></div></div>`);
    speak(a);
  };
  $('vlang').onchange = e => { S.vlang = e.target.value; };
  $('vsp').onchange = e => { S.vs = e.target.checked; };
  $('vgo').onclick = () => { ask1($('vq').value); $('vq').value = ''; };
  $('vq').onkeydown = e => { if(e.key === 'Enter'){ ask1($('vq').value); $('vq').value = ''; } };
  if(Rec) $('mic').onclick = () => {
    const rec = new Rec(); rec.lang = S.vlang; rec.interimResults = false; $('mic').textContent = 'Tinglayapman...'; $('mic').disabled = true;
    rec.onresult = e => ask1(e.results[0][0].transcript);
    rec.onerror = () => toast('Ovozni tanib bo‘lmadi. Qayta urinib ko‘ring yoki yozib so‘rang.');
    rec.onend = () => { $('mic').textContent = 'Gapirish'; $('mic').disabled = false; };
    try{ rec.start(); } catch(_){ rec.onend(); }
  };
}

/* ----- OFLAYN REJIM (sinxronlash simulyatsiyasi) ----- */
function updateNet(){
  const el = $('net'); if(!el) return;
  const n = unsynced.size, canWrite = S.user && canWriteRole(S.user.role);
  let t, off = false;
  if(SY.ro){ t = canWrite ? 'Faqat ko‘rish · boshqa qurilma faol (bosing)' : 'Faqat ko‘rish'; off = true; }

  else if(SY.busy) t = 'Sheets’ga saqlanmoqda…';
  else if(SY.err){ t = SY.err; off = true; }

  if($('nt')) $('nt').textContent = S.online ? 'Oflaynni sinash' : 'Onlaynga qaytish';
}

window.addEventListener('online', () => setOnline(true));
window.addEventListener('offline', () => setOnline(false));

/* ----- ZAXIRA NUSXA ----- */
const dateKeys = new Set(['t', 'at', 'createdAt', 'openedAt', 'closedAt', 'startedAt', 'finishedAt', 'approvedAt', 'receivedAt']);
const revive = (k, v) => dateKeys.has(k) && typeof v === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(v) ? new Date(v) : v;
function makeBackup(){
  return JSON.stringify({v: 4, at: new Date(), counters: {nextId, logId, shiftNo, saleNo, refNo, invNo, trNo, exNo},
    branches, users, customRoles, roleMap, products, log, sales, refunds, shifts, inventories, transfers, expenses, voided, unsynced: [...unsynced]});
}
function restoreBackup(text){
  const d = JSON.parse(text, revive);
  const need = ['products', 'log', 'sales', 'refunds', 'shifts', 'inventories', 'transfers', 'expenses'];
  if(!d || !need.every(k => Array.isArray(d[k])) || !d.counters) throw new Error('Fayl formati noto‘g‘ri');
  const put = (arr, src) => arr.splice(0, arr.length, ...src);
  const fz = o => Object.freeze(o);
  put(customRoles, Array.isArray(d.customRoles) ? d.customRoles : []); Object.keys(roleMap).forEach(k => delete roleMap[k]); Object.assign(roleMap, d.roleMap || {}); regRoles();
  if(Array.isArray(d.branches) && d.branches.length) put(branches, d.branches);
  if(Array.isArray(d.users) && d.users.some(u => u.role === 'super')) put(users, d.users);
  put(products, d.products);
  put(log, d.log.map(fz));
  put(sales, d.sales.map(s => fz({...s, items: fz(s.items.map(fz))})));
  put(refunds, d.refunds.map(x => fz({...x, items: fz(x.items.map(fz))})));
  put(expenses, d.expenses.map(fz));
  put(shifts, d.shifts.map(x => x.closedAt ? fz(x) : x));
  put(inventories, d.inventories.map(x => (x.status === 'open' || x.status === 'pending') ? x : fz(x)));
  put(transfers, d.transfers.map(x => x.status === 'yolda' ? x : fz(x)));
  Object.keys(voided).forEach(k => delete voided[k]);
  Object.entries(d.voided || {}).forEach(([k, v]) => { voided[k] = fz(v); });
  ({nextId, logId, shiftNo, saleNo, refNo, invNo, trNo, exNo} = d.counters);
  unsynced.clear(); (d.unsynced || []).forEach(x => unsynced.add(x));
  S.cart = []; S.dval = 0; S.card = 0; S.given = 0; S.trd = [];
  if(RAWU && !(Array.isArray(d.users) && d.users.some(u => u.role === 'super'))) setUsers(RAWU);
}
function startBk(){
  if(bkTimer) clearInterval(bkTimer);
  bkTimer = S.autoBk ? setInterval(() => {
    if(!S.user) return;
    snapshots.unshift({t: new Date(), json: makeBackup()}); snapshots.length = Math.min(snapshots.length, 5);
    if(S.tab === 'zaxira') viewZaxira();
  }, S.bkMin * 60000) : null;
}
function viewZaxira(){
  $('main').innerHTML = `<div class="card"><h2 style="margin:0 0 4px">Zaxira nusxa</h2>
    <div class="muted">Barcha mahsulotlar, savdolar, qaytarishlar, smenalar, inventarizatsiya, transfer, xarajatlar va tarix bitta faylga saqlanadi.</div>
    <div class="bar" style="margin-top:10px"><button class="btn" id="bkd">Zaxira nusxani yuklab olish</button>
      <button class="btn ghost" id="bkr">Fayldan tiklash</button><input type="file" id="bkf" accept=".json,application/json" hidden></div>
    <label class="chk"><input type="checkbox" id="bka" ${S.autoBk ? 'checked' : ''}> Avtomatik zaxira nusxa</label>
    <label for="bkm">Har necha daqiqada</label><select id="bkm">${[1, 5, 15, 30].map(m => `<option value="${m}" ${m === S.bkMin ? 'selected' : ''}>${m} daqiqa</option>`).join('')}</select></div>
  <h3>Avtomatik nusxalar (oxirgi 5 ta)</h3><div id="bks"></div>`;
  $('bks').innerHTML = snapshots.length ? snapshots.map((x, i) => `<div class="row"><div><div class="nm">${fdt(x.t)}</div><div class="sub">${Math.round(x.json.length / 1024)} KB</div></div><span></span>
    <div class="act"><button class="btn sm ghost" data-sd="${i}">Yuklab olish</button><button class="btn sm ghost" data-sr="${i}">Tiklash</button></div></div>`).join('')
    : '<div class="empty">Hali avtomatik nusxa yaratilmagan. Birinchisi belgilangan vaqtdan keyin paydo bo‘ladi.</div>';
  const stamp = () => new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
  const doRestore = async (text, label) => {
    if(!(await ask('Zaxiradan tiklaysizmi?', `${label} dagi ma’lumotlar hozirgi barcha ma’lumotlarning o‘rniga yoziladi. Hozirgi holatni saqlab qo‘yish uchun avval nusxa yuklab oling.`, 'Ha, tiklash', 'Orqaga'))) return;
    try{ restoreBackup(text); toast('Ma’lumotlar tiklandi'); render(); } catch(err){ toast('Tiklab bo‘lmadi: ' + err.message); }
  };
  $('bkd').onclick = () => { download(`zaxira-${stamp()}.json`, new Blob([makeBackup()], {type: 'application/json'})); toast('Zaxira nusxa yuklab olindi'); };
  $('bkr').onclick = () => $('bkf').click();
  $('bkf').onchange = e => { const f = e.target.files[0]; if(!f) return; const rd = new FileReader(); rd.onload = () => doRestore(String(rd.result), `«${f.name}»`); rd.readAsText(f); };
  $('bka').onchange = e => { S.autoBk = e.target.checked; startBk(); };
  $('bkm').onchange = e => { S.bkMin = +e.target.value; startBk(); };
  $('bks').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.sd) download(`zaxira-${stamp()}.json`, new Blob([snapshots[+b.dataset.sd].json], {type: 'application/json'}));
    if(b.dataset.sr){ const x = snapshots[+b.dataset.sr]; doRestore(x.json, fdt(x.t) + ' dagi nusxa'); }
  };
}


/* ---------- Dialog yordamchilari (brauzer confirm/prompt o‘rniga) ---------- */
function ask(title, body, ok, cancel){
  return new Promise(res => {
    const d = $('dlg');
    d.innerHTML = `<h2 style="margin:0 0 6px">${title}</h2><div>${body}</div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn ghost" id="ak-n">${cancel || 'Bekor qilish'}</button><button class="btn" id="ak-y">${ok || 'Ha'}</button></div>`;
    let done = false; const fin = v => { if(done) return; done = true; d.close(); res(v); };
    d.showModal(); $('ak-n').onclick = () => fin(false); $('ak-y').onclick = () => fin(true); d.onclose = () => fin(false);
  });
}
function askText(title, label){
  return new Promise(res => {
    const d = $('dlg');
    d.innerHTML = `<h2 style="margin:0 0 6px">${title}</h2><label for="at-i">${label}</label><input id="at-i"><div class="err" id="at-e" role="alert"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn ghost" id="at-n">Orqaga</button><button class="btn" id="at-y">Tasdiqlash</button></div>`;
    let done = false; const fin = v => { if(done) return; done = true; d.close(); res(v); };
    d.showModal(); $('at-i').focus();
    $('at-n').onclick = () => fin(null);
    $('at-y').onclick = () => { const v = $('at-i').value.trim(); if(!v) return $('at-e').textContent = 'Sababni yozing.'; fin(v); };
    d.onclose = () => fin(null);
  });
}

/* ---------- Inventarizatsiyani yopish: 2 bosqichli tekshiruv ---------- */
function buildInvItems(inv){
  const zero = inv.type === 'umumiy', items = [];
  products.forEach(p => {
    const has = inv.counts[p.id] !== undefined;
    if(!has && !zero) return;
    const counted = has ? inv.counts[p.id] : 0, system = p.stock[inv.branch] || 0;
    items.push(Object.freeze({pid: p.id, name: p.name, cost: p.cost, system, counted, diff: counted - system, uncounted: !has}));
  });
  return items;
}
function invReview(inv){
  const r = R(), d = $('dlg'), items = buildInvItems(inv);
  if(!items.length) return toast('Kamida bitta mahsulotni sanang.');
  const s = invSummary({items}), less = items.filter(i => i.diff < 0), more = items.filter(i => i.diff > 0), same = items.filter(i => i.diff === 0);
  const unc = items.filter(i => i.uncounted && i.diff !== 0).length;
  const line = i => `<div class="cl" style="grid-template-columns:1fr auto"><div><div class="nm">${esc(i.name)}${i.uncounted ? ' <span class="sub">(sanalmagan)</span>' : ''}</div>
    <div class="sub">Tizim: ${fmt(i.system)} · Sanaldi: ${fmt(i.counted)}</div></div><span class="badge ${i.diff < 0 ? 'b-zero' : 'b-low'}">${i.diff > 0 ? '+' : ''}${fmt(i.diff)}</span></div>`;
  d.innerHTML = `<h2 style="margin:0 0 4px">Natijani tekshiring</h2>
    <div class="muted">Hozircha ombor qoldig‘i o‘zgargani yo‘q. Yopsangiz, ${r.admin ? 'ombor qoldig‘i shu zahoti sanalgan songa moslanadi' : 'natija administratorga tasdiqlash uchun yuboriladi'}.</div>
    <div class="card" style="margin:10px 0">
      <div class="sumrow"><span>Kam chiqdi</span><span>${fmt(less.length)} xil · ${fmt(s.short)} dona${r.cost ? ' · ' + money(s.shortSum) : ''}</span></div>
      <div class="sumrow"><span>Ko‘p chiqdi</span><span>${fmt(more.length)} xil · ${fmt(s.over)} dona${r.cost ? ' · ' + money(s.overSum) : ''}</span></div>
      <div class="sumrow"><span>Mos keldi</span><span>${fmt(same.length)} xil</span></div></div>
    ${unc ? `<div class="alert warn">${unc} ta mahsulot sanalmadi, shuning uchun omborda yo‘q deb hisoblandi. Agar ular omborda bor bo‘lsa, orqaga qaytib sanang.</div>` : ''}
    <div style="max-height:40vh;overflow:auto">
      ${less.length ? '<h3 style="margin:8px 0 2px">Kam chiqqanlar</h3>' + less.map(line).join('') : ''}
      ${more.length ? '<h3 style="margin:8px 0 2px">Ko‘p chiqqanlar</h3>' + more.map(line).join('') : ''}
      ${!less.length && !more.length ? '<div class="empty">Farq yo‘q. Hamma narsa tizim bilan mos.</div>' : ''}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
      <button class="btn ghost" id="rv-b">Sanashni davom ettirish</button><button class="btn" id="rv-y">Inventarizatsiyani yopish</button></div>`;
  d.showModal();
  $('rv-b').onclick = () => d.close();
  $('rv-y').onclick = () => {
    inv.items = Object.freeze(items); inv.finishedAt = new Date(); inv.status = 'pending';
    d.close();
    if(r.admin){ approveInv(inv); toast('Inventarizatsiya yopildi, ombor qoldig‘i yangilandi'); }
    else { addLog('inventar', null, inv.branch, 0, 0, `Inventarizatsiya № ${inv.no} yakunlandi, tasdiq kutilmoqda (${items.length} ta mahsulot)`); toast('Natija administratorga yuborildi'); }
    viewInventar();
  };
}
function approveInv(inv){
  inv.items.forEach(it => {
    if(!it.diff) return;
    const p = pById(it.pid), b = p.stock[inv.branch] || 0, nb = Math.max(0, b + it.diff);
    p.stock[inv.branch] = nb;
    addLog('inventar', p, inv.branch, Math.abs(it.diff), Math.abs(it.diff) * it.cost, `Inventarizatsiya № ${inv.no}: ${it.diff < 0 ? 'kamomad' : 'ortiqcha'} ${fmt(Math.abs(it.diff))}. Qoldiq: ${fmt(b)} → ${fmt(nb)}`);
  });
  inv.status = 'approved'; inv.approvedBy = S.user.name; inv.approvedAt = new Date(); Object.freeze(inv);
}


boot();
